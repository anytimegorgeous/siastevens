<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Text Back | The Love Arcade</title>
<meta name="theme-color" content="#DCE4FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="arcade.css">
<style>
/* Look: your own phone. A chat thread, typing dots, bubbles, and three replies to choose from.
   Ends on a meter: Pushover, Holds the Line, Brick Wall. */
:root{--bg1:#DCE4FF;--bg2:#F7D9F0;--ink:#111827;--muted:#6B7280;--me:#2F6BFF;--them:#E9EAF0;--give:#F59E0B;--hold:#10B981;--cold:#64748B;
  --ac-ink:var(--ink);--ac-btn:var(--me);--ac-btn-ink:#fff;--ac-line:#D3D8E6}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif}
.ac-home{background:rgba(17,24,39,.55)}
.wrap{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:66px 18px 24px}
.phone{width:min(100%,560px);background:#fff;border-radius:38px;box-shadow:0 0 0 10px #111,0 0 0 12px #333,0 30px 60px rgba(17,24,39,.35);overflow:hidden;display:flex;flex-direction:column;min-height:min(80vh,780px)}
.scr{display:flex;flex-direction:column;flex:1}

.intro{padding:46px 32px 34px;gap:18px;justify-content:center;text-align:center;align-items:center}
.app{width:92px;height:92px;border-radius:24px;background:linear-gradient(160deg,#5B8CFF,#2F6BFF);display:grid;place-items:center;box-shadow:0 10px 24px rgba(47,107,255,.4)}
.app svg{width:52px;height:52px;fill:#fff}
.intro h1{font-size:clamp(2.4rem,7vw,3.2rem);font-weight:800;letter-spacing:-.03em}
.intro p{font-size:1.2rem;line-height:1.4;color:var(--muted);max-width:26ch}
.pill{min-height:60px;padding:0 34px;border-radius:99px;border:0;background:var(--me);color:#fff;font-size:1.2rem;font-weight:700;box-shadow:0 8px 18px rgba(47,107,255,.35)}

.head{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid #EEF0F5;background:#FAFBFD}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;font-weight:700;color:#fff}
.who{flex:1;min-width:0}
.who b{display:block;font-size:1.1rem}
.who span{display:block;font-size:.9rem;color:var(--muted);line-height:1.3}
.step{font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap}

.thread{flex:1;display:flex;flex-direction:column;gap:8px;padding:20px 16px;background:#fff}
.time{align-self:center;font-size:.78rem;color:var(--muted);margin-bottom:6px}
.b{max-width:78%;padding:11px 15px;border-radius:20px;font-size:1.18rem;line-height:1.3;animation:acPop .3s both}
.b.in{align-self:flex-start;background:var(--them);border-bottom-left-radius:6px}
.b.out{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:6px}
.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;border-radius:20px;background:var(--them)}
.typing i{width:8px;height:8px;border-radius:50%;background:#9CA3AF;animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{30%{transform:translateY(-5px);background:#6B7280}}
.tag{align-self:flex-end;display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:82%;margin-top:6px;text-align:right;animation:acPop .35s both}
.tag strong{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:99px;color:#fff}
.tag p{font-size:1.02rem;color:var(--muted);line-height:1.35}

.dock{padding:14px 14px 18px;background:#F4F5F9;border-top:1px solid #E6E8EF;display:flex;flex-direction:column;gap:10px}
.dock .k{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
.reply{min-height:58px;padding:12px 18px;border-radius:20px;border:2px solid #D6DAE6;background:#fff;color:var(--ink);font-size:1.1rem;text-align:left;line-height:1.3}
.reply:active{background:#EEF3FF;border-color:var(--me)}
.dock .pill{align-self:center}

.end{padding:40px 28px 26px;gap:18px;text-align:center;align-items:stretch}
.end .k{font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.end h2{font-size:clamp(2.3rem,7vw,3.2rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.end .line{font-size:1.2rem;line-height:1.4;color:#374151}
.gauge{position:relative;width:min(100%,380px);margin:4px auto 0}
.gauge svg{display:block;width:100%;height:auto}
.needle{transform-origin:150px 150px;transition:transform 1.2s cubic-bezier(.3,1.4,.5,1)}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.zones span{padding:6px 2px;border-radius:8px;background:#F1F2F6;color:var(--muted)}
.zones span.on{color:#fff}
.counts{font-size:.95rem;color:var(--muted)}
.strength{font-size:1.05rem;font-weight:700}
html.talk .phone{width:min(100%,680px)}
@media (max-height:760px) and (orientation:landscape){.phone{min-height:auto}}
/* clean games: no mid-game counters; scores come at the end */
.step{display:none!important}
</style>
</head>
<body>
<main class="wrap">
  <div class="phone">
    <section class="scr intro pop" id="s-intro">
      <div class="app" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.6 1.4 4.9 3.6 6.5L5 21.5l4-2.2c.9.2 1.9.3 3 .3 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/></svg></div>
      <h1>Text Back</h1>
      <p>Six real-life texts. Pick what you&rsquo;d actually send. We&rsquo;ll read your thumbs.</p>
      <button class="pill" id="start">Open messages</button>
    </section>

    <section class="scr" id="s-q" hidden>
      <div class="head"><div class="av" id="av"></div><div class="who"><b id="name"></b><span id="ctx"></span></div><span class="step" id="step"></span></div>
      <div class="thread" id="thread" aria-live="polite"></div>
      <div class="dock" id="dock"></div>
    </section>

    <section class="scr end" id="s-end" hidden></section>
  </div>
</main>

<script src="arcade.js"></script>
<script>
/* Each chat: name, colour, the situation, incoming texts, and three replies:
   give (gives in, rewards low effort), hold (calm and clear), cold (shuts the door). From Chapter 25, Hold the Line,
   and Chapter 11, The Exchange. */
const CHATS = [
  {n:"Jake", c:"#F97316", ctx:"Third last-minute cancel in a row", t:"6:12 PM", in:["Hey sorry, can’t make it tonight 😬", "Something came up"],
   give:["No worries! Another time 😊", "No consequence, no reason to change. He’ll cancel again."],
   hold:["That’s three times now. If you want to see me, you plan the next one.", "Pattern named, calmly. The effort is back on him."],
   cold:["Don’t bother texting me again.", "A slammed door teaches nothing. Calm reads as fact."]},
  {n:"Chris", c:"#8B5CF6", ctx:"Two dates in. Only ever texts after 11", t:"11:04 PM", in:["Wanna come over? 😏"],
   give:["Sure! On my way 🙂", "Low effort worked. Why would he ever plan a real date?"],
   hold:["Not tonight. Dinner this weekend, though?", "You swapped a low-effort offer for a real one. His answer tells you everything."],
   cold:["Wow. Classy. Bye.", "You learned nothing about him. A held line is a test, not a verdict."]},
  {n:"Sam", c:"#EF4444", ctx:"You told them a joke of theirs hurt", t:"8:47 PM", in:["Omg you’re so sensitive", "It was a joke"],
   give:["You’re right, sorry. I’ll let it go.", "You signed off on your own feelings being wrong."],
   hold:["I’m not too sensitive. I’m telling you what I’m not okay with.", "The standard stays where it is. No heat, no retreat."],
   cold:["And you’re a jerk. We’re done.", "Now the fight is about you, not the joke."]},
  {n:"Alex", c:"#0EA5E9", ctx:"Third favor this week. Hasn’t asked how you are", t:"9:30 PM", in:["Can you drive me to the airport at 6am? 🙏", "You’re the best"],
   give:["Of course! Anything you need 💕", "Giving that never comes back isn’t love. It’s a leak."],
   hold:["I can this time. It’s felt a bit one-way lately though. Coffee this week?", "You gave, and named the imbalance. That’s an exchange."],
   cold:["Call an Uber.", "You closed the door instead of balancing the scale."]},
  {n:"Riley", c:"#22C55E", ctx:"Ghosted you for three weeks", t:"7:15 PM", in:["Hey stranger 👋", "Miss me?"],
   give:["Omg hi!! Yes 😊", "Three weeks of silence, wiped out with one emoji."],
   hold:["You disappeared for three weeks. What happened?", "Warm, but the gap gets named. Now they have to show up."],
   cold:["Who is this?", "Petty feels good for a minute. It doesn’t hold a standard."]},
  {n:"Jordan", c:"#EC4899", ctx:"Your partner. You’ve planned the last five dates", t:"5:40 PM", in:["Date night tonight?", "idk you pick 🤷"],
   give:["Okay! I’ll book the usual place.", "One person holding it up gets tired, then resentful."],
   hold:["I picked the last five. Your turn. Surprise me 😉", "Light, and it hands back half the load."],
   cold:["Forget it. Let’s just stay in.", "Now nobody plans, and nobody wins."]}
];
const ZONES = {
  give: {name:"Pushover", color:"#F59E0B", line:"You give, they take. Kind is good. Endless is a leak. Hold the line, warmly, and watch who rises to it."},
  hold: {name:"Holds the Line", color:"#10B981", line:"Calm and clear. You reward effort and starve the low kind. Your standards do the sorting for you."},
  cold: {name:"Brick Wall", color:"#64748B", line:"Safe, but sealed. You protect yourself by closing doors. Hold the line without slamming it, and the right ones can still come in."}
};
const $ = id => document.getElementById(id);
let i = 0, tally = {give:0, hold:0, cold:0}, timers = [];
function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
function show(id){ ["s-intro","s-q","s-end"].forEach(s => $(s).hidden = s !== id); $(id).classList.remove("pop"); void $(id).offsetWidth; $(id).classList.add("pop"); scrollTo(0,0); }
function start(){ timers.forEach(clearTimeout); i = 0; tally = {give:0, hold:0, cold:0}; show("s-q"); chat(); }

function chat(){
  const c = CHATS[i];
  $("av").textContent = c.n[0]; $("av").style.background = c.c;
  $("name").textContent = c.n; $("ctx").textContent = c.ctx; $("step").textContent = `${i + 1} of ${CHATS.length}`;
  const th = $("thread"); th.innerHTML = `<p class="time">${c.t}</p>`;
  $("dock").innerHTML = "";
  let t = 300;
  c.in.forEach((msg, k) => {
    later(() => { th.insertAdjacentHTML("beforeend", `<div class="typing" id="typing"><i></i><i></i><i></i></div>`); }, t);
    t += 700;
    later(() => { const ty = $("typing"); if (ty) ty.remove(); th.insertAdjacentHTML("beforeend", `<div class="b in">${Arcade.esc(msg)}</div>`); }, t);
    t += 250;
  });
  later(() => {
    const opts = Arcade.shuffle(["give","hold","cold"]);
    $("dock").innerHTML = `<p class="k">What do you send?</p>` + opts.map(z => `<button class="reply" data-z="${z}">${Arcade.esc(c[z][0])}</button>`).join("");
  }, t + 150);
}
function send(z){
  const c = CHATS[i]; tally[z]++;
  $("dock").innerHTML = "";
  const th = $("thread");
  th.insertAdjacentHTML("beforeend", `<div class="b out">${Arcade.esc(c[z][0])}</div>`);
  later(() => {
    th.insertAdjacentHTML("beforeend", `<div class="tag"><strong style="background:${ZONES[z].color}">${ZONES[z].name}</strong><p>${Arcade.esc(c[z][1])}</p></div>`);
    $("dock").innerHTML = `<button class="pill" id="next">${i === CHATS.length - 1 ? "See my meter" : "Next text"}</button>`;
  }, 500);
}
function end(){
  /* a tie goes to the warning: give, then cold, then hold */
  const top = ["give","cold","hold"].reduce((a, b) => tally[b] > tally[a] ? b : a);
  const z = ZONES[top], n = CHATS.length;
  /* needle: -90 (all give) to +90 (all cold); held lines pull it to the middle */
  const ang = ((tally.cold - tally.give) / n) * 90;
  const strength = Math.round(tally.hold / n * 10);
  $("s-end").innerHTML = `<p class="k">Your reply style</p>
    <div class="gauge"><svg viewBox="0 0 300 165" aria-hidden="true">
      <path d="M30 150a120 120 0 0 1 60-104" stroke="#F59E0B" stroke-width="26" fill="none"/>
      <path d="M96 42a120 120 0 0 1 108 0" stroke="#10B981" stroke-width="26" fill="none"/>
      <path d="M210 46a120 120 0 0 1 60 104" stroke="#64748B" stroke-width="26" fill="none"/>
      <g class="needle" id="needle" style="transform:rotate(-90deg)"><path d="M146 150 150 48 154 150z" fill="#111827"/></g>
      <circle cx="150" cy="150" r="12" fill="#111827"/></svg></div>
    <div class="zones">${["give","hold","cold"].map(k => `<span class="${k === top ? "on" : ""}" style="${k === top ? "background:" + ZONES[k].color : ""}">${ZONES[k].name}</span>`).join("")}</div>
    <h2 style="color:${z.color}">${z.name}</h2>
    <p class="line">${z.line}</p>
    <p class="strength">Line strength: ${strength}/10</p>
    <p class="counts">Gave in ${tally.give} &middot; Held the line ${tally.hold} &middot; Shut the door ${tally.cold}</p>
    ${Arcade.footer({chapter: 25, line: "Hold the Line: how to keep a standard at low temperature. Scan for the book."})}`;
  show("s-end");
  setTimeout(() => { const nd = $("needle"); if (nd) nd.style.transform = `rotate(${ang}deg)`; }, 120);
}
document.addEventListener("click", e => {
  const r = e.target.closest(".reply"); if (r){ send(r.dataset.z); return; }
  if (e.target.closest("#next")){ i++; if (i < CHATS.length) chat(); else end(); }
});
$("start").onclick = start;
Arcade.init({again: start});
</script>
</body>
</html>
