<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Who Gets the Call? | The Love Arcade</title>
<meta name="theme-color" content="#F3E6C8">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Courier+Prime:wght@400;700&display=swap">
<link rel="stylesheet" href="arcade.css">
<style>
/* Look: a landline-era kitchen. Cream paper, an oxblood telephone, brass trim, typewriter text. Every need gets a call:
   a person, or an app. After each one, a note from the 90s says who used to pick up. */
:root{--paper:#F3E6C8;--paper2:#EAD8B0;--ox:#8B1E2B;--ox2:#5E111B;--brass:#B8892E;--ink:#2A1B12;--muted:#6E5A45;--app:#1F7A8C;
  --ac-ink:var(--ink);--ac-btn:var(--ox);--ac-btn-ink:var(--paper);--ac-line:var(--brass)}
body{background:radial-gradient(120% 80% at 50% 0%,#FBF3DE,var(--paper) 55%,var(--paper2));color:var(--ink);font-family:"Courier Prime",ui-monospace,monospace}
body::before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(110,90,69,.05) 0 2px,transparent 2px 6px)}
.ac-home{background:var(--ox2)}
.wrap{position:relative;max-width:820px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:70px 22px 28px;display:flex;flex-direction:column;justify-content:center}
.scr{display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center}
.disp{font-family:"Abril Fatface",Georgia,serif;font-weight:400}

.phone{width:150px;height:auto}
.intro h1{font-size:max(3rem,min(9vw,5.4rem));line-height:.95;color:var(--ox)}
.intro p{font-size:1.25rem;line-height:1.45;max-width:30ch}
.dial{min-height:66px;padding:0 40px;border:3px solid var(--ox2);border-radius:99px;background:var(--ox);color:var(--paper);font:400 1.5rem "Abril Fatface";box-shadow:0 6px 0 var(--ox2)}
.dial:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ox2)}

.ticket{position:relative;width:min(100%,640px);padding:26px 26px 22px;background:#FFF9EA;border:2px solid var(--brass);box-shadow:6px 6px 0 var(--brass)}
.ticket .no{font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-size:.85rem}
.ticket h2{font-size:max(2.1rem,min(6vw,3.2rem));line-height:1.05;margin-top:8px;color:var(--ox)}
.ticket .ask{margin-top:10px;font-size:1.15rem}
.lines{display:flex;gap:6px;justify-content:center}
.lines i{width:22px;height:22px;border-radius:50%;border:2px solid var(--brass);background:#FFF9EA}
.lines i.p{background:var(--ox);border-color:var(--ox)} .lines i.a{background:var(--app);border-color:var(--app)} .lines i.n{box-shadow:0 0 0 3px rgba(184,137,46,.35)}

.choose{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(100%,640px)}
.ch{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:150px;justify-content:center;padding:18px 12px;border-radius:18px;border:3px solid;background:#FFF9EA;font-family:"Courier Prime"}
.ch svg{width:54px;height:54px}
.ch b{font:400 1.8rem "Abril Fatface"}
.ch small{font-size:.95rem;color:var(--muted);line-height:1.3}
.ch.p{border-color:var(--ox);color:var(--ox)} .ch.a{border-color:var(--app);color:var(--app)}
.ch:active{transform:scale(.97)}
.choose.done .ch:not(.on){opacity:.35}
.ch.on{box-shadow:0 0 0 5px rgba(184,137,46,.4)}

.memo{width:min(100%,640px);padding:18px 22px;background:var(--ox);color:var(--paper);text-align:left;transform:rotate(-1deg);box-shadow:0 10px 22px rgba(42,27,18,.25);animation:acPop .4s both}
.memo .k{font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:.8rem;color:#F1C77A}
.memo p{font-size:1.25rem;line-height:1.4;margin-top:6px}
.nbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.next.res{background:var(--ox);color:var(--paper)}
.next{min-height:56px;padding:0 30px;border-radius:99px;border:2.5px solid var(--ox);background:transparent;color:var(--ox);font:700 1.1rem "Courier Prime";letter-spacing:.06em}

.res .big{font-size:max(4.4rem,min(16vw,8rem));line-height:.9;color:var(--app)}
.res .big.low{color:var(--ox)}
.res .sub{font:400 max(1.5rem,min(4vw,2.1rem)) "Abril Fatface"}
.res .line{font-size:1.2rem;line-height:1.45;max-width:34ch}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px}
.tagp{padding:6px 12px;border-radius:99px;font-size:.92rem;font-weight:700;border:2px solid}
.tagp.p{color:var(--ox);border-color:var(--ox)} .tagp.a{color:#fff;background:var(--app);border-color:var(--app)}
.legend{font-size:.95rem;color:var(--muted)}
.ac-foot{max-width:640px;width:100%;background:#FFF9EA}
/* clean games: no mid-game counters; scores come at the end */
.lines,.ticket .no{display:none!important}
</style>
<script src="old-safari.js"></script>
</head>
<body>
<main class="wrap">
  <section class="scr intro pop" id="s-intro">
    <svg class="phone" viewBox="0 0 150 120" aria-hidden="true"><path d="M20 40c0-18 25-30 55-30s55 12 55 30l-6 14H98l-4-14H56l-4 14H26z" fill="#8B1E2B"/><path d="M38 62h74l14 44a6 6 0 0 1-6 8H30a6 6 0 0 1-6-8z" fill="#8B1E2B"/><circle cx="75" cy="86" r="22" fill="#F3E6C8" stroke="#B8892E" stroke-width="4"/><circle cx="75" cy="86" r="7" fill="#B8892E"/></svg>
    <h1 class="disp">Who Gets<br>the Call?</h1>
    <p>Ten everyday needs. When it happened last, who did you turn to: a person, or an app?</p>
    <button class="dial" id="start">Pick up</button>
  </section>

  <section class="scr" id="s-q" hidden>
    <div class="lines" id="lines"></div>
    <article class="ticket"><p class="no" id="no"></p><h2 class="disp" id="need"></h2><p class="ask">Last time, who got the call?</p></article>
    <div class="choose" id="choose">
      <button class="ch p" data-c="p"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="7" r="4.2"/><path d="M3.5 21c.6-4.6 4.1-7.5 8.5-7.5s7.9 2.9 8.5 7.5z"/></svg><b>A person</b><small id="pwho">Someone I know</small></button>
      <button class="ch a" data-c="a"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><rect x="8" y="5" width="8" height="12" rx="1" fill="#FFF9EA"/></svg><b>An app</b><small id="awho"></small></button>
    </div>
    <div class="memo" id="memo" hidden><p class="k">In the 90s, the call went to&hellip;</p><p id="then"></p></div>
    <div class="nbtns"><button class="next" id="next" hidden>Next call &rarr;</button><button class="next res" id="results" hidden>See my results</button></div>
  </section>

  <section class="scr res" id="s-end" hidden></section>
</main>

<script src="arcade.js"></script>
<script>
/* need, the apps that answer it now, who answered in the 90s. From Chapter 12's "Who Gets the Call". */
const NEEDS = [
  ["A recipe", "Google, YouTube", "Mom, an aunt, a grandmother. The food came with a catch-up."],
  ["A ride to the airport", "Uber, Lyft", "A friend or a brother. The goodbye at the curb was the point."],
  ["Something breaks", "Yelp, TaskRabbit", "Dad, or the neighbor with tools. The fix was the excuse. The hours were the point."],
  ["Advice on a big decision", "Google, ChatGPT", "An old friend or a parent. Asking meant admitting you were lost, and that made you closer."],
  ["Stories about how life goes", "Podcasts, TikTok", "A grandparent. Wisdom no search bar carries, and they got to be needed."],
  ["Moving day", "Movers, TaskRabbit", "Friends and pizza on the boxes. A favor owed binds people."],
  ["Soup when you’re sick", "DoorDash, Uber Eats", "The lady next door. The soup was medicine. The knock was the cure."],
  ["Borrowing a ladder", "Amazon, Marketplace", "A neighbor. The ladder came back with a story."],
  ["Good news to celebrate", "An Instagram story", "A full table. Joy in a room, with faces you could see."],
  ["Someone to watch life with", "TikTok, Reels", "The street, the porch, the neighbors. You were a neighbor, not a spectator."]
];
const $ = id => document.getElementById(id);
let i = 0, ans = [], locked = false;
function show(id){ ["s-intro","s-q","s-end"].forEach(s => $(s).hidden = s !== id); $(id).classList.remove("pop"); void $(id).offsetWidth; $(id).classList.add("pop"); scrollTo(0,0); }
function start(){ i = 0; ans = []; show("s-q"); ask(); }
function ask(){
  locked = false;
  const n = NEEDS[i];
  $("lines").innerHTML = NEEDS.map((_, k) => `<i class="${k < i ? ans[k] : k === i ? "n" : ""}"></i>`).join("");
  $("no").textContent = `Call ${String(i + 1).padStart(2, "0")} of ${NEEDS.length}`;
  $("need").textContent = n[0]; $("awho").textContent = n[1];
  $("choose").classList.remove("done"); document.querySelectorAll(".ch").forEach(c => c.classList.remove("on"));
  $("memo").hidden = true; $("next").hidden = true; $("results").hidden = true;
}
function pick(c, el){
  if (locked) return; locked = true;
  ans[i] = c; el.classList.add("on"); $("choose").classList.add("done");
  $("then").textContent = NEEDS[i][2]; $("memo").hidden = false;
  /* after six calls they choose: results now, or keep going (up to ten) */
  const more = i < NEEDS.length - 1;
  $("next").hidden = false; $("next").textContent = more ? "Next call →" : "See my village →";
  $("results").hidden = !(more && i >= 5);
}
function end(){
  const n = ans.length, apps = ans.filter(a => a === "a").length, pct = Math.round(apps / n * 100), share = apps / n;
  const band = share <= .3 ? ["A real village.", "Your needs still run through people. That&rsquo;s a support network money didn&rsquo;t build. Keep calling."]
    : share <= .6 ? ["Half village, half apps.", "Every app you picked is better at the task. But the person was never doing the task. They were doing the tie. One call re-tightens it."]
    : ["Your life runs on apps.", "Efficient, and alone in it. What we call privacy can be the absence of a support network. Move one need back to a person this month."];
  $("s-end").innerHTML = `<p class="no" style="font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)">Your switchboard</p>
    <p class="big disp${share <= .3 ? " low" : ""}">${pct}%</p>
    <p class="sub">of your calls go to apps</p>
    <div class="row">${ans.map((a, k) => `<span class="tagp ${a}">${Arcade.esc(NEEDS[k][0])}</span>`).join("")}</div>
    <p class="legend"><b style="color:var(--ox)">Outlined</b> = a person &middot; <b style="color:var(--app)">Filled</b> = an app</p>
    <p class="sub" style="font-size:1.6rem">${band[0]}</p>
    <p class="line">${band[1]}</p>
    ${Arcade.footer({chapter: 12, line: "Needing and being needed: why people, not services, hold a life together."})}`;
  show("s-end");
}
document.querySelectorAll(".ch").forEach(c => c.addEventListener("click", () => pick(c.dataset.c, c)));
$("next").onclick = () => { i++; if (i < NEEDS.length) ask(); else end(); };
$("results").onclick = end;
$("start").onclick = start;
Arcade.init({again: start});
</script>
</body>
</html>
