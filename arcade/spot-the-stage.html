<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spot the Stage | The Love Arcade</title>
<meta name="theme-color" content="#FFF8EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@500;600;700&display=swap">
<link rel="stylesheet" href="arcade.css">
<style>
/* Look: a pop-art reflex game. Halftone paper, one big scene card, three chunky buttons in the three
   stage colours, and a fuse that burns down. Fast hands, high score. */
:root{--paper:#FFF8EC;--ink:#1D1A2E;--a:#FF4F5E;--r:#FFB703;--c:#14B37D;--muted:#6E6880;
  --ac-ink:var(--ink);--ac-btn:var(--ink);--ac-btn-ink:#fff;--ac-line:var(--ink)}
body{background:radial-gradient(circle,rgba(29,26,46,.09) 1.4px,transparent 1.6px) 0 0/16px 16px,var(--paper);color:var(--ink);font-family:"Rubik",system-ui,sans-serif}
.ac-home{background:var(--ink)}
.wrap{max-width:860px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:66px 20px 26px;display:flex;flex-direction:column;justify-content:center}
.scr{display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center}
.pop-t{font:400 clamp(3rem,10vw,5.8rem)/.9 "Lilita One";letter-spacing:.01em;text-shadow:4px 4px 0 var(--r)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.st{padding:16px 12px;border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);color:#fff}
.st b{display:block;font:400 1.5rem "Lilita One";letter-spacing:.02em}
.st span{font-weight:600;font-size:1.05rem}
.st.a{background:var(--a)} .st.r{background:var(--r);color:var(--ink)} .st.c{background:var(--c)}
.lead{font-size:1.2rem;font-weight:500;color:var(--muted);max-width:30ch}
.go{min-height:68px;padding:0 44px;border:3px solid var(--ink);border-radius:16px;background:var(--ink);color:#fff;font:400 1.6rem "Lilita One";box-shadow:5px 5px 0 var(--r)}
.go:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--r)}

.hud{display:flex;justify-content:space-between;align-items:center;width:100%;font:700 1.05rem "Rubik"}
.hud .pts{font:400 1.8rem "Lilita One"}
.fuse{width:100%;height:14px;border:3px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
.fuse i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--c),var(--r),var(--a));transform-origin:left}
.card{position:relative;width:100%;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;border:4px solid var(--ink);border-radius:24px;background:#fff;box-shadow:8px 8px 0 var(--ink)}
.card .em{font-size:clamp(4rem,12vw,6rem);line-height:1}
.card h2{font:700 clamp(1.7rem,4.6vw,2.4rem)/1.15 "Rubik";max-width:20ch}
.card.flash{animation:acPop .3s both}
.burst{position:absolute;top:-22px;right:-14px;padding:10px 16px;border:3px solid var(--ink);border-radius:12px;font:400 1.5rem "Lilita One";transform:rotate(8deg);animation:acPop .3s both}
.burst.ok{background:var(--c);color:#fff} .burst.no{background:var(--a);color:#fff}
.why{min-height:1.6em;font-weight:600;font-size:1.15rem}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.pick button{min-height:84px;border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);font:400 clamp(1.15rem,3vw,1.6rem) "Lilita One";letter-spacing:.02em;color:#fff}
.pick button:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.pick .a{background:var(--a)} .pick .r{background:var(--r);color:var(--ink)} .pick .c{background:var(--c)}
.pick.done button:not(.on){opacity:.3}

.opts{display:grid;gap:12px;width:100%;max-width:620px}
.opt{min-height:66px;padding:12px 18px;border:3px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink);font:600 1.2rem "Rubik";box-shadow:4px 4px 0 var(--ink);text-align:left}
.hi{font:400 clamp(4.4rem,15vw,7.5rem)/.9 "Lilita One";text-shadow:5px 5px 0 var(--r)}
.rank{font:400 clamp(1.8rem,5vw,2.6rem) "Lilita One"}
.note{padding:16px 20px;border:3px solid var(--ink);border-radius:16px;background:#fff;max-width:620px;font-size:1.15rem;line-height:1.4;font-weight:500;text-align:left}
.note b{display:block;font:400 1.4rem "Lilita One";margin-bottom:4px}
.ac-foot{background:#fff;max-width:620px;width:100%}
@media (max-width:560px){.three{grid-template-columns:1fr}.pick button{min-height:70px}}
/* clean games: no mid-game counters; scores come at the end */
.hud{display:none!important}
</style>
</head>
<body>
<main class="wrap">
  <section class="scr pop" id="s-intro">
    <h1 class="pop-t">Spot the<br>Stage</h1>
    <div class="three">
      <div class="st a"><b>Attraction</b><span>Something pulls you in</span></div>
      <div class="st r"><b>Reciprocation</b><span>Something comes back</span></div>
      <div class="st c"><b>Co-creation</b><span>Something new gets made</span></div>
    </div>
    <p class="lead">Every bond in nature runs on these three. Ten scenes. Tap the stage before the fuse runs out.</p>
    <button class="go" id="start">Go!</button>
  </section>

  <section class="scr" id="s-q" hidden>
    <div class="hud"><span id="cnt"></span><span class="pts" id="pts">0</span></div>
    <div class="fuse"><i id="fuse"></i></div>
    <div class="card" id="card"><span class="em" id="em"></span><h2 id="scene"></h2></div>
    <p class="why" id="why"></p>
    <div class="pick" id="pick">
      <button class="a" data-s="a">Attraction</button>
      <button class="r" data-s="r">Reciprocation</button>
      <button class="c" data-s="c">Co-creation</button>
    </div>
  </section>

  <section class="scr" id="s-own" hidden>
    <p class="rank">Bonus round: you</p>
    <h2 style="font:700 clamp(1.7rem,4.6vw,2.4rem)/1.15 Rubik;max-width:22ch">Think of a relationship that faded. Where did it stall?</h2>
    <div class="opts" id="opts"></div>
  </section>

  <section class="scr" id="s-end" hidden></section>
</main>

<script src="arcade.js"></script>
<script>
/* Chapter 5's "Spot the Stage": [emoji, scene, stage, why]. The last is the book's trap. */
const SCENES = [
  ["🌳", "A tree grows toward sunlight", "a", "Pulled toward value. No exchange yet."],
  ["🐝", "Bees pollinate the flowers that feed them", "r", "Both give, both get."],
  ["🪸", "Coral and algae build a reef", "c", "Together they build what neither could."],
  ["🍎", "A child reaches for a red apple", "a", "Desire before decision."],
  ["🛍️", "You make a purchase", "r", "Value for value."],
  ["👶", "A baby is born", "c", "Something that never existed before."],
  ["🍲", "The food smells so good", "a", "Your body reacts before your brain decides."],
  ["🏜️", "Two rivers carve a canyon", "c", "Two forces, one canyon."],
  ["📷", "You keep staring at someone’s photo", "a", "It keeps pulling your eyes back."],
  ["🍳", "Ingredients become a meal", "c", "None of them is a meal alone."],
  ["👗", "You try on a dress at the mall", "a", "Something caught your eye first."],
  ["👉", "You swipe right", "a", "Just the pull. Nothing has come back yet."],
  ["💞", "It’s a match. They swiped right too", "r", "The signal came back. Stage two."],
  ["📅", "You plan a date, together", "c", "A plan two people made."],
  ["👋", "You wave at a stranger. They wave back", "r", "You gave, it came back."],
  ["🎸", "Two musicians jam and write a hit", "c", "Neither walked in with that song."],
  ["🙋", "You wave at a stranger. Nothing comes back", "a", "Trap! Nothing returned, so it never left stage one."]
];
const NAME = {a:"Attraction", r:"Reciprocation", c:"Co-creation"};
const STALL = [
  ["The spark faded", "Attraction", "Attraction is a live reading of value. It moves, and it can be rebuilt."],
  ["It started to feel one-way", "Reciprocation", "The exchange stopped flowing. Nothing in nature survives one-way flow."],
  ["We stopped building anything new", "Co-creation", "Nothing new was being made. Love that is only consumed burns down."]
];
const $ = id => document.getElementById(id);
const ROUNDS = 10;
let order = [], i = 0, pts = 0, right = 0, t0 = 0, raf = 0, locked = false, tm = 0;
const LIMIT = () => Arcade.talk() ? 15000 : 7000;
function show(id){ ["s-intro","s-q","s-own","s-end"].forEach(s => $(s).hidden = s !== id); $(id).classList.remove("pop"); void $(id).offsetWidth; $(id).classList.add("pop"); scrollTo(0,0); }
function start(){
  const trap = SCENES[16], rest = Arcade.shuffle(SCENES.slice(0, 16)).slice(0, ROUNDS - 1);
  order = rest.slice(0, 6).concat([trap], rest.slice(6));
  i = 0; pts = 0; right = 0; $("pts").textContent = "0"; show("s-q"); ask();
}
function ask(){
  locked = false;
  const s = order[i];
  $("cnt").textContent = `Scene ${i + 1} / ${ROUNDS}`;
  $("em").textContent = s[0]; $("scene").textContent = s[1]; $("why").textContent = "";
  const old = $("card").querySelector(".burst"); if (old) old.remove();
  const c = $("card"); c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash");
  $("pick").classList.remove("done"); [...$("pick").children].forEach(b => b.classList.remove("on"));
  t0 = performance.now(); cancelAnimationFrame(raf); tick();
}
function tick(){
  const left = Math.max(0, 1 - (performance.now() - t0) / LIMIT());
  $("fuse").style.transform = `scaleX(${left})`;
  if (left <= 0 && !locked){ answer(null); return; }
  if (!locked) raf = requestAnimationFrame(tick);
}
function answer(stage, btn){
  if (locked) return; locked = true; cancelAnimationFrame(raf);
  const s = order[i], ok = stage === s[2];
  const left = Math.max(0, 1 - (performance.now() - t0) / LIMIT());
  if (ok){ right++; pts += 100 + Math.round(left * 100); }
  $("pts").textContent = pts;
  if (btn) btn.classList.add("on"); $("pick").classList.add("done");
  $("card").insertAdjacentHTML("beforeend", `<span class="burst ${ok ? "ok" : "no"}">${ok ? "Yes!" : stage ? "Nope" : "Too slow"}</span>`);
  $("why").textContent = `${NAME[s[2]]}. ${s[3]}`;
  tm = setTimeout(() => { i++; if (i < ROUNDS) ask(); else own(); }, Arcade.talk() ? 2600 : 1500);
}
function own(){
  $("opts").innerHTML = STALL.map((s, k) => `<button class="opt" data-k="${k}">${s[0]}</button>`).join("");
  show("s-own");
}
function end(k){
  const rank = right >= 9 ? "Stage Spotter Supreme" : right >= 6 ? "Natural" : "Still Warming Up";
  const s = STALL[k];
  $("s-end").innerHTML = `<p style="font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)">High score</p>
    <p class="hi">${pts}</p><p class="rank">${rank} &middot; ${right}/${ROUNDS}</p>
    <div class="note"><b>Your stall: ${s[1]}</b>${s[2]} You spotted the stages everywhere. Your own love life is the hardest place to see them.</div>
    ${Arcade.footer({chapter: 5, line: "The three stages, and what restarts the cycle when one stalls."})}`;
  show("s-end");
}
$("pick").addEventListener("click", e => { const b = e.target.closest("button"); if (b) answer(b.dataset.s, b); });
$("opts").addEventListener("click", e => { const b = e.target.closest(".opt"); if (b) end(+b.dataset.k); });
$("start").onclick = start;
Arcade.init({again: () => { clearTimeout(tm); start(); }});
</script>
</body>
</html>
