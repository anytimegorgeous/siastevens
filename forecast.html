<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A crystal ball that reads your answers, not the stars. A dozen quick questions, then your chances out of 10, what's in the way, and what to do about it. From Sia Stevens, author of A Million Green Flags.">
<meta property="og:title" content="Green Flag Forecast">
<meta property="og:description" content="Ask the ball. A dozen quick questions, then your chances out of 10 and what's in the way.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://siastevens.com/forecast">
<meta name="theme-color" content="#140C26">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Green Flag Forecast | Sia Stevens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Cinzel:wght@600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap">
<style>
/* Layout: a fortune-teller's booth in one centred column. A striped awning on top, the crystal ball
   as the one loud element with its reply beneath it, one question card, and two or three answers.
   One committed night-time look, so there is a single palette. */
:root{
  color-scheme:dark;
  --night:#140C26; --night-2:#21143A; --night-glow:#2B1754; --line:#3B2A5E;
  --cream:#FFF3DC; --muted:#B9ABD2;
  --gold:#F6C453; --gold-deep:#B9862B; --gold-glow:rgba(246,196,83,.6);
  --velvet:#B3234A; --velvet-deep:#7C1634;
  --mist:#7CE8D8; --mist-glow:rgba(124,232,216,.35); --orchid:#C77DFF; --orchid-glow:rgba(199,125,255,.22);
  --ball-1:#3A2380; --ball-2:#1E1150; --ball-3:#0D0722; --ball-in:rgba(0,0,0,.45);
  --glass-edge:rgba(255,255,255,.14); --shine:rgba(255,255,255,.8); --shine-soft:rgba(255,255,255,.16);
  --card-face:#FFF4DD; --card-face-2:#F3DFB6; --card-ink:#2A1740; --card-muted:#6A5A80;
  --card-line:#B9862B; --card-gold-ink:#8A5F12; --flag:#57E08B;
  --shadow:rgba(0,0,0,.5);
  --display:"Limelight","Copperplate","Didot",Georgia,serif;
  --caps:"Cinzel","Trajan Pro","Copperplate",Georgia,serif;
  --body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --s1:1.125rem; --s2:1.3125rem;
  --s3:clamp(1.5rem,4.6vw,2.125rem);
  --s3d:clamp(1.75rem,5.4vw,2.5rem);
  --s4:clamp(2.25rem,8.4vw,4rem);
}

*{box-sizing:border-box}
body{background:radial-gradient(120% 70% at 50% 0%,var(--night-glow) 0%,var(--night) 62%) var(--night);color:var(--cream);font:400 1rem/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button{touch-action:manipulation;font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mist);outline-offset:3px}
[data-focus]:focus{outline:none}

#sky,#fx{position:fixed;inset:0;pointer-events:none}
#sky{z-index:0}
#fx{z-index:5}
.awning-wrap,.wrap{position:relative;z-index:1}

.awning-wrap{filter:drop-shadow(0 6px 10px var(--shadow))}
.awning{height:46px;background:repeating-linear-gradient(90deg,var(--velvet) 0 36px,var(--cream) 36px 72px);
  -webkit-mask:radial-gradient(circle at 50% 0,#000 17.5px,transparent 18.5px) 0 100%/36px 18px repeat-x,linear-gradient(#000 0 0) 0 0/100% calc(100% - 18px) no-repeat;
          mask:radial-gradient(circle at 50% 0,#000 17.5px,transparent 18.5px) 0 100%/36px 18px repeat-x,linear-gradient(#000 0 0) 0 0/100% calc(100% - 18px) no-repeat}

.wrap{max-width:44rem;margin-inline:auto;padding-inline:20px;padding-block:14px 36px;display:flex;flex-direction:column;gap:20px}
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:40px}
.bar-links{display:flex;gap:18px;margin-left:auto}
.bar-top[hidden],.bar-links [hidden],.bar-top [hidden]{display:none}
.wordmark{font:400 1rem/1 var(--display);color:var(--gold);white-space:nowrap}
.link{background:none;border:0;padding:10px 4px;font:600 .9375rem/1 var(--body);color:var(--cream);text-decoration:underline;text-underline-offset:3px;cursor:pointer;white-space:nowrap}

.up{animation:up .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n,0)*90ms)}
@keyframes up{from{opacity:0;transform:translateY(14px)}}

/* crystal ball */
.orb{--d:clamp(150px,38vw,210px);width:var(--d);margin-inline:auto}
.orb.big{--d:clamp(190px,50vw,270px)}
.orb.small{--d:clamp(96px,22vw,128px)}
.ball{position:relative;z-index:1;width:var(--d);height:var(--d);border-radius:50%;overflow:hidden;isolation:isolate;transform:translateZ(0);
  background:radial-gradient(circle at 50% 60%,var(--ball-1) 0%,var(--ball-2) 60%,var(--ball-3) 100%);
  box-shadow:inset 0 0 0 2px var(--glass-edge),inset 0 -18px 40px var(--ball-in),0 0 36px 4px var(--mist-glow),0 0 90px 18px var(--orchid-glow);
  animation:glow 4.5s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 0 0 2px var(--glass-edge),inset 0 -18px 40px var(--ball-in),0 0 54px 10px var(--mist-glow),0 0 120px 30px var(--orchid-glow)}}
.mist{position:absolute;inset:-18%;border-radius:50%;clip-path:circle(36.76%);filter:blur(calc(var(--d)*.09));opacity:.75;mix-blend-mode:screen;
  background:conic-gradient(from 0deg,transparent 0 18%,var(--mist) 30%,transparent 46%,var(--orchid) 62%,transparent 76%,var(--mist) 90%,transparent);
  animation:swirl 10s linear infinite}
.mist.b{inset:0;clip-path:circle(50%);opacity:.5;animation-duration:15s;animation-direction:reverse}
@keyframes swirl{to{transform:rotate(1turn)}}
.orb.fast .mist{animation-duration:1.4s}
.orb.fast .mist.b{animation-duration:2.1s}
.orb.fast .ball{animation:glow 1s ease-in-out infinite,quake .3s linear infinite}
.orb.speak .mist{animation-duration:2.4s}
.orb.speak .ball{animation:glow .7s ease-in-out infinite}
@keyframes quake{25%{transform:translate(1px,-1px)}75%{transform:translate(-1px,1px)}}
.shine{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 30% 24%,var(--shine) 0 3%,var(--shine-soft) 10%,transparent 24%),radial-gradient(circle at 60% 105%,var(--mist-glow),transparent 45%)}
.num{position:absolute;inset:0;z-index:1;display:grid;place-items:center;font:400 calc(var(--d)*.5)/1 var(--display);color:var(--cream);text-shadow:0 0 18px var(--mist),0 0 4px var(--night);font-variant-numeric:tabular-nums}
.stand{width:calc(var(--d)*.6);height:calc(var(--d)*.15);margin:calc(var(--d)*-.045) auto 0;background:linear-gradient(180deg,var(--gold-deep),var(--gold) 45%,var(--gold-deep));clip-path:polygon(16% 0,84% 0,100% 100%,0 100%)}
.plate{width:calc(var(--d)*.72);height:calc(var(--d)*.045);margin:0 auto;border-radius:99px;background:var(--gold-deep)}

/* intro */
.intro{display:flex;flex-direction:column;gap:20px;text-align:center;align-items:center}
.marquee{width:100%;border:2px solid var(--gold);border-radius:16px;background:var(--night-2);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.bulbs{display:flex;justify-content:space-between}
.bulbs i{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px 2px var(--gold-glow);animation:blink 1.2s steps(1) infinite}
.bulbs i:nth-child(even){animation-delay:.6s}
@keyframes blink{50%{opacity:.25;box-shadow:none}}
.kicker{font:700 .8125rem/1 var(--caps);letter-spacing:.3em;text-transform:uppercase;color:var(--mist)}
h1{font:400 var(--s4)/1 var(--display);color:var(--cream);text-shadow:0 0 22px var(--gold-glow)}
.lede{font:600 var(--s2)/1.3 var(--body);max-width:30ch}
.ticket{position:relative;display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center;min-width:min(18rem,100%);padding:16px 34px 18px;background:linear-gradient(180deg,var(--gold),var(--gold-deep) 170%);color:var(--card-ink);border:0;border-radius:10px;cursor:pointer;transition:transform .15s}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--night)}
.ticket::before{left:-11px}
.ticket::after{right:-11px}
.tk-k{font:700 .75rem/1 var(--caps);letter-spacing:.24em;text-transform:uppercase;opacity:.75}
.tk-t{font:400 1.625rem/1.1 var(--display)}

/* a question */
.quiz{display:flex;flex-direction:column;gap:18px}
.oracle{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.says{display:flex;align-items:center;justify-content:center;min-height:2.5em;max-width:24ch;font:400 clamp(1.1875rem,3.8vw,1.5rem)/1.2 var(--display);color:var(--gold);text-shadow:0 0 18px var(--gold-glow)}
.says.swap{animation:up .35s ease-out both}
.tarot{position:relative;width:min(100%,30rem);min-height:11rem;margin-inline:auto;padding:26px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  background:linear-gradient(165deg,var(--card-face),var(--card-face-2));color:var(--card-ink);border-radius:18px;box-shadow:0 20px 44px var(--shadow),0 0 0 1px var(--gold-deep)}
.tarot::before{content:"";position:absolute;inset:10px;border:1.5px solid var(--card-line);border-radius:10px;pointer-events:none}
.deal{animation:deal .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes deal{from{opacity:0;transform:perspective(900px) translateY(-26px) rotateY(-70deg) rotate(-6deg)}}
.t-top{display:flex;align-items:center;gap:10px;font:700 1rem/1 var(--caps);letter-spacing:.12em;color:var(--card-gold-ink)}
.t-top svg{width:11px;height:11px;fill:currentColor}
.stmt{font:600 var(--s3)/1.2 var(--body)}
.answers{display:grid;gap:12px}
.answers.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.answers.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ans{display:flex;align-items:center;justify-content:center;text-align:center;min-height:76px;padding:14px 12px;background:var(--night-2);color:var(--cream);border:2px solid var(--gold);border-radius:18px;font:600 1.125rem/1.25 var(--body);cursor:pointer;transition:background .12s,color .12s,box-shadow .12s}
.ans[aria-pressed="true"]{background:var(--gold);color:var(--card-ink);box-shadow:0 0 26px var(--gold-glow)}
.ans:active{transform:scale(.97)}
@media (hover:hover){
  .ans:hover{background:var(--line);box-shadow:0 0 18px var(--gold-glow)}
  .ans[aria-pressed="true"]:hover{background:var(--gold)}
  .ticket:hover{transform:translateY(-3px) rotate(-1deg)}
}
.pips{display:flex;justify-content:center;gap:14px;min-height:14px;padding-top:4px}
.pip{width:10px;height:10px;transform:rotate(45deg);border:1.5px solid var(--line)}
.pip.done{background:var(--gold-deep);border-color:var(--gold-deep)}
.pip.now{border-color:var(--gold);box-shadow:0 0 10px var(--gold-glow)}

/* the ball clouds over */
.divine{display:flex;flex-direction:column;align-items:center;gap:30px;padding-block:28px 40px;text-align:center}
.d-line{font:400 var(--s3d)/1.15 var(--display);color:var(--gold);min-height:2.4em}
.d-line.swap{animation:up .4s ease-out both}

/* the ending */
.result{display:flex;flex-direction:column;gap:24px}
.reveal-top{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.reveal-top .orb{margin-bottom:14px}
.label{font:600 var(--s2)/1.2 var(--body)}
.asof{font:700 .75rem/1 var(--caps);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.outof{font:600 var(--s1)/1.2 var(--body);font-variant-numeric:tabular-nums;margin-top:6px}
.verdict{font:400 var(--s3d)/1.1 var(--display);color:var(--gold);text-shadow:0 0 22px var(--gold-glow);margin-top:6px;max-width:20ch}
.reading{position:relative;display:flex;flex-direction:column;gap:10px;padding:26px 26px 24px;background:linear-gradient(165deg,var(--card-face),var(--card-face-2));color:var(--card-ink);border-radius:18px;box-shadow:0 20px 44px var(--shadow),0 0 0 1px var(--gold-deep)}
.reading::before{content:"";position:absolute;inset:10px;border:1.5px solid var(--card-line);border-radius:10px;pointer-events:none}
.rd-k{font:700 .75rem/1 var(--caps);letter-spacing:.22em;text-transform:uppercase;color:var(--card-gold-ink);margin-top:6px}
.rd-k:first-child{margin-top:0}
.rd-p{font-size:var(--s1);line-height:1.45}
.rd-point{font-weight:600;line-height:1.45;color:var(--velvet-deep);margin-top:4px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px}
.primary{background:linear-gradient(180deg,var(--gold),var(--gold-deep) 170%);color:var(--card-ink);border:0;border-radius:99px;padding:16px 26px;font:400 1.25rem/1 var(--display);cursor:pointer}
.aside{color:var(--muted)}
.secondary{background:none;color:var(--cream);border:2px solid var(--gold);border-radius:99px;padding:14px 24px;font:400 1.25rem/1 var(--display);cursor:pointer}
.take{display:flex;align-items:center;gap:18px;padding:18px;border:1.5px solid var(--gold-deep);border-radius:14px;background:var(--night-2)}
.take-qr{display:block;flex:none;width:140px;height:140px;padding:10px;background:#fff;border-radius:8px}
.take-qr svg{display:block;width:100%;height:100%}
.take-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.take-k{font:700 .75rem/1 var(--caps);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.take-t{font:600 var(--s1)/1.3 var(--body)}
.aside-link{color:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--gold-deep)}
/* the print sheet: the slip as one picture over the page, with Share, Print and Close */
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;gap:14px;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:rgba(12,7,24,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet[hidden]{display:none}
.sheet-top{width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between}
.sheet-k{font:700 .75rem/1 var(--caps);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.sheet-scroll{flex:1;min-height:0;width:100%;max-width:560px;overflow:auto;border-radius:10px;-webkit-overflow-scrolling:touch}
.sheet-scroll img{display:block;width:min(100%,380px);height:auto;margin:0 auto;background:#fff;border-radius:6px;box-shadow:0 18px 40px var(--shadow)}
.sheet-bar{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 16px}
.sheet-bar a.secondary{text-decoration:none;display:inline-block;line-height:1}
.sheet-scroll img.card{width:min(100%,420px);border-radius:14px}
.sheet-scroll.mid{display:flex;align-items:center;justify-content:center}
.scan{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;width:min(100%,380px);margin:0 auto;padding:26px 22px;border:1.5px solid var(--gold-deep);border-radius:14px;background:var(--night-2)}
.scan-qr{width:236px;height:236px;padding:14px;background:#fff;border-radius:10px}
.scan-qr svg{display:block;width:100%;height:100%}
.scan .take-txt{align-items:center}
/* the quick-reading switch */
.toggle{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;margin-top:8px;background:none;border:0;padding:6px 0;cursor:pointer;color:var(--muted);font:600 .8125rem/1 var(--body)}
.toggle[hidden]{display:none}
.tg-track{position:relative;flex:none;width:34px;height:20px;border-radius:99px;border:1.5px solid var(--line);background:var(--night-2);transition:background .15s,border-color .15s}
.tg-knob{position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.toggle[aria-checked="true"] .tg-track{background:var(--gold-deep);border-color:var(--gold-deep)}
.toggle[aria-checked="true"] .tg-knob{transform:translateX(14px);background:var(--cream)}
.toggle[aria-checked="true"]{color:var(--cream)}
.tg-state{font-weight:400}
#slip{display:none}
#slip img{display:block;width:62mm;height:auto}
@media print{
  @page{size:62mm auto;margin:0}
  html,body{background:#fff!important;color:#000!important;margin:0;padding:0}
  #sky,#fx,.awning-wrap,.wrap,.sheet{display:none!important}
  #slip{display:block!important}
}


.fine{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px;font-size:.8125rem;color:var(--muted)}
.fine p{max-width:72ch}

@media (max-width:560px){
  .take{flex-direction:column;text-align:center;align-items:center}
  .take-txt{align-items:center}
  .answers.n2,.answers.n3{grid-template-columns:minmax(0,1fr)}
  .ans{min-height:58px}
  .tarot{padding:24px 22px;min-height:9.5rem}
  .actions{justify-content:center;text-align:center}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="awning-wrap" aria-hidden="true"><div class="awning"></div></div>

<div class="wrap">
  <header id="bar-top" class="bar-top" hidden>
    <span class="wordmark" id="wordmark">Green Flag Forecast</span>
    <span class="bar-links"><button id="restart-top" class="link" data-act="restart">Start over</button></span>
  </header>

  <main id="app"></main>

  <footer class="fine">
    <p>For fun and for conversation. Nothing you answer here is saved. If you ever feel afraid of a partner, the National Domestic Violence Hotline answers 24 hours a day: 1-800-799-7233 or thehotline.org.</p>
    <button id="quick" class="toggle" data-act="quick" role="switch" aria-checked="false" hidden><span class="tg-track" aria-hidden="true"><span class="tg-knob"></span></span><span class="tg-txt">Quick reading</span><span class="tg-state" id="quick-state">Off</span></button>
  </footer>
</div>
<div id="slip" aria-hidden="true"></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-k" data-act="sheet-bg" hidden>
  <div class="sheet-top"><span class="sheet-k" id="sheet-k">Your reading</span><button id="sheet-close" class="link" data-act="close-sheet">Close</button></div>
  <div class="sheet-scroll" id="sheet-scroll"></div>
  <div class="sheet-bar"><button id="print-now" class="primary" data-act="print-now">Print</button><button id="share" class="secondary" data-act="share" hidden>Share</button><button id="scan" class="secondary" data-act="scan">Scan</button><a id="save-card" class="secondary" download="green-flag-forecast.png" hidden>Save image</a></div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
/* ---------- The question tree ----------
   N(id, group, question, options). An option is [answer, ball's reply, next, found, set, quickFound].
   The reply and the finding can be functions of the reading so far. END finishes. Every branch reaches a reading.
   Every area has an opening question; a bad answer usually gets one more question, and that answer
   decides what the ball found and how big it is. In a quick reading only the OPENERS are asked, and an
   option's quickFound is what the ball concludes when its follow-up is skipped.
   Every question has to make sense on its own, without the card before it. */
const NODES = {};
function N(id, g, q, opts){ NODES[id] = {id, g, q, opts}; }
const OPENERS = new Set(["I1", "S1", "S2", "G1", "L1", "T2", "P1", "V1", "C1", "A0", "A1", "F1", "J1", "H1", "D1", "L1s", "Q1", "W1", "B1", "N1", "K1", "X1", "M1", "R1"]);

N("I1", null, "Your love life right now?", [
  ["Single", "Let's see what's in the way.", "S1", null, {track:"single"}],
  ["Seeing someone", "Let's see what it's made of.", "A0", null, {track:"seeing"}],
  ["Committed", "Let's see what you've built.", "B1", null, {track:"est"}]]);

/* ----- Single ----- */
N("S1", "drive", "When was your last first date?", [
  ["This month", "So the engine runs.", "G1", null, {dated:true}],
  ["This year", "Not long ago. Let's look closer.", "S2"],
  ["Longer ago", "A while, then.", "S2", null, {gap:true}]]);
N("S2", "drive", "On a typical night in, what gets most of your time?", [
  ["Games or shows", "A full evening. Let's see how often.", "S5", null, null, "screen_some"],
  ["My phone", "The thumb never rests.", "S3", null, null, "phone"],
  ["Something else", c => c.gap ? "Then it isn't the screen. It's the calendar." : "Then it isn't the screen.", "S4", c => c.gap ? "gap" : null]]);
N("S3", "drive", "Late at night, what is the phone mostly for?", [
  ["Scrolling", "Hard to see one face in a crowd.", "G1", "feed"],
  ["Dating apps", "Many matches. No chairs filled.", "G1", "swiping"],
  ["Something private", "The ball keeps secrets. It also keeps count.", "G1", "private"]]);
N("S4", "drive", "Is it work that takes your evenings?", [
  ["Yes", "Long days.", "G1", "work"],
  ["No", "Then the evenings are yours. Use them.", "G1"]]);
N("S5", "drive", "Is that most nights?", [
  ["Yes", "A full evening and an empty chair.", "G1", "screen"],
  ["No", "A treat, then. Not a habit.", "G1"]]);

N("G1", "guard", "Someone decent shows interest in you. First thought?", [
  ["Why not", "An open door. Good.", "L1"],
  ["What's the catch", "Burned before, the ball suspects.", "G2", null, null, "guard"],
  ["Not right now", "The door stays shut, then.", "G2", null, null, "guard"]]);

/* A small QR code maker: byte mode, medium error correction, versions 1 to 10 (up to 213 characters).
   qrMatrix(text) returns rows of 0/1. Follows ISO 18004 the plain way: data bits, Reed-Solomon blocks,
   function patterns, zigzag placement, the mask with the lowest penalty. */
const QR_ECC = [10, 16, 26, 18, 24, 16, 18, 22, 22, 26];   /* error-correction codewords per block, level M */
const QR_BLOCKS = [1, 1, 1, 2, 2, 4, 4, 4, 5, 5];           /* blocks per version, level M */
function qrMatrix(text){
  const bytes = [...new TextEncoder().encode(text)];
  let ver = 1;
  const rawWords = v => { let r = (16 * v + 128) * v + 64; if (v >= 2){ const a = Math.floor(v / 7) + 2; r -= (25 * a - 10) * a - 55; if (v >= 7) r -= 36; } return r >> 3; };
  const dataWords = v => rawWords(v) - QR_ECC[v - 1] * QR_BLOCKS[v - 1];
  while (ver <= 10 && 4 + (ver < 10 ? 8 : 16) + bytes.length * 8 > dataWords(ver) * 8) ver++;
  if (ver > 10) throw new Error("too long for a QR code here");
  const size = ver * 4 + 17, cap = dataWords(ver);
  /* data bits */
  const bits = [];
  const put = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
  put(4, 4); put(bytes.length, ver < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
  put(0, Math.min(4, cap * 8 - bits.length));
  while (bits.length % 8) bits.push(0);
  for (let pad = 0xEC; bits.length < cap * 8; pad ^= 0xEC ^ 0x11) put(pad, 8);
  const data = []; for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i + 8).join(""), 2));
  /* Reed-Solomon over GF(256) */
  const mul = (a, b) => { let z = 0; for (let i = 7; i >= 0; i--){ z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((b >>> i) & 1) * a; } return z; };
  const ecLen = QR_ECC[ver - 1], nBlocks = QR_BLOCKS[ver - 1], raw = rawWords(ver);
  let gen = [1];
  for (let i = 0, root = 1; i < ecLen; i++, root = mul(root, 2)){
    const g = new Array(gen.length + 1).fill(0);
    gen.forEach((c, j) => { g[j] ^= c; g[j + 1] ^= mul(c, root); });
    gen = g;
  }
  const ecc = block => { const r = new Array(ecLen).fill(0); for (const b of block){ const f = b ^ r.shift(); r.push(0); gen.slice(1).forEach((c, j) => { r[j] ^= mul(c, f); }); } return r; };
  const shortBlocks = nBlocks - raw % nBlocks, shortLen = Math.floor(raw / nBlocks) - ecLen;
  const blocks = []; let k = 0;
  for (let i = 0; i < nBlocks; i++){ const len = shortLen + (i < shortBlocks ? 0 : 1); const d = data.slice(k, k + len); k += len; blocks.push([...d, ...(i < shortBlocks ? [-1] : []), ...ecc(d)]); }
  const words = [];
  for (let i = 0; i < blocks[0].length; i++) blocks.forEach(b => { if (b[i] >= 0) words.push(b[i]); });
  /* function patterns */
  const m = Array.from({length: size}, () => new Array(size).fill(0)), fn = Array.from({length: size}, () => new Array(size).fill(false));
  const set = (x, y, v) => { if (x >= 0 && y >= 0 && x < size && y < size){ m[y][x] = v ? 1 : 0; fn[y][x] = true; } };
  const finder = (cx, cy) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++){ const d = Math.max(Math.abs(dx), Math.abs(dy)); set(cx + dx, cy + dy, d !== 2 && d !== 4); } };
  finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
  for (let i = 8; i < size - 8; i++){ set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
  const nAlign = Math.floor(ver / 7) + 2, step = Math.ceil((ver * 4 + 4) / (nAlign * 2 - 2)) * 2, pos = [6];
  for (let p = size - 7; pos.length < nAlign; p -= step) pos.splice(1, 0, p);
  if (ver >= 2) pos.forEach((px, i) => pos.forEach((py, j) => {
    if ((i === 0 && j === 0) || (i === 0 && j === nAlign - 1) || (i === nAlign - 1 && j === 0)) return;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(px + dx, py + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
  }));
  const format = mask => {
    const d = (0 << 3) | mask; let rem = d;                 /* level M is 00 */
    for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    const f = ((d << 10) | rem) ^ 0x5412, bit = i => (f >>> i) & 1;
    for (let i = 0; i <= 5; i++) set(8, i, bit(i));
    set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
    for (let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
    for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(i));
    for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(i));
    set(8, size - 8, 1);
  };
  format(0);
  if (ver >= 7){
    let rem = ver; for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
    const v = (ver << 12) | rem;
    for (let i = 0; i < 18; i++){ const b = (v >>> i) & 1, a = size - 11 + i % 3, c = Math.floor(i / 3); set(a, c, b); set(c, a, b); }
  }
  /* data, zigzag */
  let i = 0;
  for (let right = size - 1; right >= 1; right -= 2){
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++){
      const x = right - j, y = ((right + 1) & 2) === 0 ? size - 1 - vert : vert;
      if (!fn[y][x] && i < words.length * 8){ m[y][x] = (words[i >> 3] >>> (7 - (i & 7))) & 1; i++; }
    }
  }
  /* masks */
  const MASKS = [(x, y) => (x + y) % 2, (x, y) => y % 2, (x, y) => x % 3, (x, y) => (x + y) % 3, (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2,
    (x, y) => (x * y) % 2 + (x * y) % 3, (x, y) => ((x * y) % 2 + (x * y) % 3) % 2, (x, y) => ((x + y) % 2 + (x * y) % 3) % 2];
  const apply = mask => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && MASKS[mask](x, y) === 0) m[y][x] ^= 1; };
  const penalty = () => {
    /* the four penalty rules of the standard: long runs, 2 by 2 blocks, finder look-alikes, dark balance */
    let p = 0;
    const addHist = (h, len) => { if (h[0] === 0) len += size; h.pop(); h.unshift(len); };
    const look = h => { const n = h[1], core = n > 0 && h[2] === n && h[3] === n * 3 && h[4] === n && h[5] === n; return (core && h[0] >= n * 4 && h[6] >= n ? 1 : 0) + (core && h[6] >= n * 4 && h[0] >= n ? 1 : 0); };
    const line = get => {
      let color = 0, run = 0; const h = new Array(7).fill(0);
      for (let i = 0; i < size; i++){
        const v = get(i);
        if (v === color){ run++; if (run === 5) p += 3; else if (run > 5) p++; }
        else { addHist(h, run); if (!color) p += look(h) * 40; color = v; run = 1; }
      }
      if (color){ addHist(h, run); run = 0; }
      addHist(h, run + size); p += look(h) * 40;
    };
    for (let i = 0; i < size; i++){ line(x => m[i][x]); line(y => m[y][i]); }
    let dark = 0;
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++){
      dark += m[y][x];
      if (y < size - 1 && x < size - 1 && m[y][x] === m[y][x + 1] && m[y][x] === m[y + 1][x] && m[y][x] === m[y + 1][x + 1]) p += 3;
    }
    const k = Math.ceil(Math.abs(dark * 20 - size * size * 10) / (size * size)) - 1;
    return p + Math.max(0, k) * 10;
  };
  let best = 0, bestP = Infinity;
  for (let mask = 0; mask < 8; mask++){ format(mask); apply(mask); const p = penalty(); if (p < bestP){ bestP = p; best = mask; } apply(mask); }
  format(best); apply(best);
  return m;
}

/* In a quick reading the follow-ups are skipped: jump ahead to the next opening question. */
function skipTo(id){
  let guard = 0;
  while (id !== "END" && !OPENERS.has(id) && guard++ < 20) id = NODES[id].opts[0][2];
  return id;
}

/* Replays the taps from the start, so Back is just dropping the last one. */
function replay(answers, quick){
  const c = {quick: !!quick, track: null, taste: null, dated: false, gap: false, len: null, dates: null, common: null, found: [], steps: 0, last: "", id: "I1", done: false};
  for (const a of answers){
    const node = NODES[c.id];
    if (!node) break;
    const o = node.opts[a];
    if (!o) break;
    const [, sayv, next, fnd, set, qf] = o;
    if (set) Object.assign(c, set);
    const say = typeof sayv === "function" ? sayv(c) : sayv;
    const src = (c.quick && qf !== undefined) ? qf : fnd;
    const found = typeof src === "function" ? src(c) : src;
    if (found && !c.found.includes(found)) c.found.push(found);
    c.last = say; c.steps++;
    let nx = typeof next === "function" ? next(c) : next;
    if (c.quick) nx = skipTo(nx);
    if (nx === "END"){ c.done = true; c.id = null; break; }

/* The number: every area is worth the same. A clean area scores full, a small finding half, a big one
   nothing. Average across the areas, times ten, to the nearest half, never below 1. */
function reading(c){
  const F = FIND[c.track] || {};
  const areas = (AREAS[c.track] || []).map(([key, name, ok]) => {
    const items = c.found.filter(k => F[k] && F[k][1] === key).map(k => F[k]).sort((a, b) => b[2] - a[2]);
    const pts = items.reduce((t, x) => t + x[2], 0);
    return {key, name, ok, items, score: pts >= 2 ? 0 : pts === 1 ? .5 : 1};
  });
  const avg = areas.length ? areas.reduce((t, a) => t + a.score, 0) / areas.length : 1;
  const n = Math.max(1, Math.round(avg * 20) / 2);
  const verdict = n >= 8 ? "Very little in the way. Keep going." : n >= 5 ? "A few things in the way. All fixable." : "A lot in the way. Start with one.";
  const rank = ORDER[c.track] || [];
  const byRank = (a, b) => rank.indexOf(a.key) - rank.indexOf(b.key);
  /* the worst areas first (a zero before a half), then the book's order */
  const hit = areas.filter(a => a.items.length).sort((a, b) => (a.score - b.score) || byRank(a, b));
  const found = hit.flatMap(a => a.items);
  return {n, verdict, areas, found, hit, clean: areas.filter(a => !a.items.length).sort(byRank)};
}

/* The reading in words: the ball reads the person, finding by finding in the order that matters,

/* The printed slip, drawn as one picture: 62 mm wide at 300 dots per inch, black on white, as long as
   the reading needs. The printer is thermal, so everything is pure black or white. */
const SLIP_W = Math.round(62 / 25.4 * 300);
const F_DISPLAY = '"Limelight", "Copperplate", Georgia, serif', F_CAPS = '"Cinzel", "Copperplate", Georgia, serif', F_BODY = '"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif';
let slipJob = 0, slipUrl = "", slipWaiters = [];

function wrapLines(x, text, maxW){
  const lines = []; let line = "";
  for (const w of text.split(" ")){
    const t = line ? line + " " + w : w;
    if (x.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
function spaced(x, text, cx, y, gap){
  const widths = [...text].map(ch => x.measureText(ch).width);
  const total = widths.reduce((t, w) => t + w, 0) + gap * (text.length - 1);
  let px = cx - total / 2;
  [...text].forEach((ch, i) => { x.fillText(ch, px, y); px += widths[i] + gap; });
}
function hrule(x, y, W, M, h){ x.fillRect(M, y, W - 2 * M, h); }

async function drawSlip(c){
  const job = ++slipJob; slipUrl = "";
  const {r, see, act, point} = forecast(c);
  try {
    await Promise.race([Promise.all([`400 42px ${F_DISPLAY}`, `400 29px ${F_BODY}`, `700 29px ${F_BODY}`].map(f => document.fonts.load(f))), new Promise(res => setTimeout(res, 2500))]);
  } catch (err) {}
  if (job !== slipJob) return;
  /* The same layout as the text slip: 3 mm margins, 7 point body, rules above and below each heading. */
  const W = SLIP_W, M = 35, CW = W - 2 * M;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = 6000;
  const x = cv.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, cv.width, cv.height);
  x.fillStyle = "#000"; x.textBaseline = "alphabetic";
  const heading = (t) => { hrule(x, y, W, M, 4); y += 38; x.textAlign = "center"; x.font = `700 27px ${F_BODY}`; spaced(x, t, W / 2, y, 7); y += 16; hrule(x, y, W, M, 4); y += 40; };
  const para = (t, font) => { x.textAlign = "left"; x.font = font; for (const l of wrapLines(x, t, CW)){ x.fillText(l, M, y); y += 36; } };
  let y = M + 38;
  x.textAlign = "center";
  x.font = `400 42px ${F_DISPLAY}`; x.fillText("Green Flag Forecast", W / 2, y); y += 84;
  x.font = `400 92px ${F_DISPLAY}`;
  const numW = x.measureText(fmt(r.n)).width;
  x.font = `400 42px ${F_DISPLAY}`;
  const outW = x.measureText(" / 10").width, nx = W / 2 - (numW + outW) / 2;
  x.textAlign = "left";
  x.font = `400 92px ${F_DISPLAY}`; x.fillText(fmt(r.n), nx, y);
  x.font = `400 42px ${F_DISPLAY}`; x.fillText(" / 10", nx + numW, y);
  x.textAlign = "center"; y += 40;
  x.font = `400 29px ${F_BODY}`; x.fillText(LABEL[c.track], W / 2, y); y += 42;
  x.font = `700 35px ${F_BODY}`; x.fillText(r.verdict, W / 2, y); y += 30;
  heading("THE FORECAST");
  para(see, `400 29px ${F_BODY}`); y += 14;
  heading("WHAT TO DO");
  para(act, `400 29px ${F_BODY}`); y += 16;
  para(point, `700 29px ${F_BODY}`); y += 22;
  /* The slip already holds the reading, so its code goes to the site. The screen's code opens the reading. */
  const QR = qrMatrix(SITE), mod = 8, qs = QR.length * mod, qx = Math.round((W - qs) / 2);
  QR.forEach((row, j) => row.forEach((v, i) => { if (v) x.fillRect(qx + i * mod, y + j * mod, mod, mod); }));
  y += qs + 40; x.textAlign = "center";
  x.font = `400 28px ${F_BODY}`; x.fillText("Scan for the book, the course and coaching", W / 2, y); y += 36;
  x.font = `700 30px ${F_BODY}`; x.fillText(SITE_TEXT, W / 2, y); y += M;
  const out = document.createElement("canvas"); out.width = W; out.height = Math.ceil(y);
  const o = out.getContext("2d"); o.fillStyle = "#fff"; o.fillRect(0, 0, W, out.height); o.drawImage(cv, 0, 0);
  if (job !== slipJob) return;
  slipUrl = out.toDataURL("image/png");
  const holder = document.getElementById("slip");
  if (holder) holder.innerHTML = `<img src="${slipUrl}" alt="">`;
  slipWaiters.splice(0).forEach(fn => fn());
}
function whenSlipReady(){ return slipUrl ? Promise.resolve() : new Promise(res => slipWaiters.push(res)); }

/* The share card: a square picture with the ball, the number and the verdict, and nothing private. */
let cardUrl = "", cardFor = "";
async function drawCard(c){
  const key = state.answers.join("") + (c.quick ? "q" : "f");
  if (cardUrl && cardFor === key) return cardUrl;
  const r = reading(c), S = 1080;
  try { await Promise.race([Promise.all([`400 240px ${F_DISPLAY}`, `400 60px ${F_DISPLAY}`, `700 30px ${F_CAPS}`, `600 40px ${F_BODY}`].map(f => document.fonts.load(f))), new Promise(res => setTimeout(res, 2500))]); } catch (err) {}
  const cv = document.createElement("canvas"); cv.width = S; cv.height = S;
  const x = cv.getContext("2d");
  /* night sky */
  const bg = x.createRadialGradient(S / 2, 0, 40, S / 2, 0, S); bg.addColorStop(0, "#2B1754"); bg.addColorStop(.6, "#140C26"); bg.addColorStop(1, "#0D0722");
  x.fillStyle = bg; x.fillRect(0, 0, S, S);
  let seed = 7; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  x.fillStyle = "#FFF3DC";
  for (let i = 0; i < 90; i++){ x.globalAlpha = .25 + rnd() * .5; x.beginPath(); x.arc(rnd() * S, rnd() * S, rnd() * 2 + .6, 0, 6.2832); x.fill(); }
  x.globalAlpha = 1;
  /* wordmark */
  x.textAlign = "center"; x.textBaseline = "alphabetic";
  x.fillStyle = "#F6C453"; x.font = `700 30px ${F_CAPS}`; spaced(x, "GREEN FLAG FORECAST", S / 2, 96, 9);
  /* the ball */
  const cx = S / 2, cy = 420, R = 210;
  x.save(); x.shadowColor = "rgba(199,125,255,.55)"; x.shadowBlur = 90; x.fillStyle = "#1E1150"; x.beginPath(); x.arc(cx, cy, R, 0, 6.2832); x.fill(); x.restore();
  x.save(); x.shadowColor = "rgba(124,232,216,.5)"; x.shadowBlur = 40; x.fillStyle = "#1E1150"; x.beginPath(); x.arc(cx, cy, R, 0, 6.2832); x.fill(); x.restore();
  const g = x.createRadialGradient(cx, cy + R * .2, 10, cx, cy, R); g.addColorStop(0, "#3A2380"); g.addColorStop(.6, "#1E1150"); g.addColorStop(1, "#0D0722");
  x.fillStyle = g; x.beginPath(); x.arc(cx, cy, R, 0, 6.2832); x.fill();
  x.save(); x.beginPath(); x.arc(cx, cy, R, 0, 6.2832); x.clip();
  const m1 = x.createRadialGradient(cx - R * .5, cy + R * .3, 10, cx - R * .5, cy + R * .3, R * .9); m1.addColorStop(0, "rgba(199,125,255,.55)"); m1.addColorStop(1, "rgba(199,125,255,0)");
  x.fillStyle = m1; x.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  const m2 = x.createRadialGradient(cx + R * .55, cy - R * .2, 10, cx + R * .55, cy - R * .2, R * .9); m2.addColorStop(0, "rgba(124,232,216,.5)"); m2.addColorStop(1, "rgba(124,232,216,0)");
  x.fillStyle = m2; x.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  const sh = x.createRadialGradient(cx - R * .4, cy - R * .5, 4, cx - R * .4, cy - R * .5, R * .45); sh.addColorStop(0, "rgba(255,255,255,.85)"); sh.addColorStop(.35, "rgba(255,255,255,.18)"); sh.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = sh; x.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  x.restore();
  x.strokeStyle = "rgba(255,255,255,.18)"; x.lineWidth = 3; x.beginPath(); x.arc(cx, cy, R - 1.5, 0, 6.2832); x.stroke();
  /* stand */
  const st = x.createLinearGradient(0, cy + R - 10, 0, cy + R + 60); st.addColorStop(0, "#B9862B"); st.addColorStop(.45, "#F6C453"); st.addColorStop(1, "#B9862B");
  x.fillStyle = st; x.beginPath(); x.moveTo(cx - 70, cy + R - 12); x.lineTo(cx + 70, cy + R - 12); x.lineTo(cx + 115, cy + R + 56); x.lineTo(cx - 115, cy + R + 56); x.closePath(); x.fill();
  x.fillStyle = "#B9862B"; x.beginPath(); x.roundRect(cx - 150, cy + R + 56, 300, 18, 9); x.fill();
  /* the number */
  x.fillStyle = "#FFF3DC"; x.shadowColor = "rgba(124,232,216,.9)"; x.shadowBlur = 30;
  x.font = `400 240px ${F_DISPLAY}`; x.fillText(fmt(r.n), cx, cy + 86);
  x.shadowBlur = 0;
  /* label, verdict */
  x.fillStyle = "#B9ABD2"; x.font = `600 40px ${F_BODY}`; x.fillText(LABEL[c.track] + ": " + fmt(r.n) + " out of 10", cx, 772);
  x.fillStyle = "#F6C453"; x.shadowColor = "rgba(246,196,83,.5)"; x.shadowBlur = 24; x.font = `400 60px ${F_DISPLAY}`;
  let y = 856; for (const l of wrapLines(x, r.verdict, 900)){ x.fillText(l, cx, y); y += 68; }
  x.shadowBlur = 0;
  /* the address */
  x.fillStyle = "#FFF3DC"; x.font = `600 34px ${F_BODY}`; x.fillText("Ask the ball at siastevens.com/forecast", cx, 1010);
  cardUrl = cv.toDataURL("image/png"); cardFor = key;
  return cardUrl;
}
async function shareCard(btn){
  const c = replay(state.answers, state.quick);
  if (!c.done) return;
  const url = await drawCard(c), r = reading(c);
  try {
    const blob = await (await fetch(url)).blob();
    const file = new File([blob], "green-flag-forecast.png", {type: "image/png"});
    if (navigator.canShare && navigator.canShare({files: [file]})){
      await navigator.share({files: [file], title: "Green Flag Forecast", text: `${LABEL[c.track]}: ${fmt(r.n)} out of 10. Ask the ball at ${PAGE}`});
      return;
    }
  } catch (err) { if (err && err.name === "AbortError") return; }

}

/* Print my reading opens the sheet: the slip as a picture, Share (where the device has a share sheet),
   Print, Close. Printing sends only the slip to the printer. */
let sheetOpener = null, sheetView = "slip", sheetMode = "slip";
/* The sheet shows the slip, or, after Scan, a QR code that opens this reading on the visitor's phone. */
function renderSheet(){
  const box = document.getElementById("sheet-scroll");
  const card = sheetMode === "card";
  document.getElementById("print-now").hidden = card; document.getElementById("scan").hidden = card;
  document.getElementById("save-card").hidden = !card; document.getElementById("sheet-k").textContent = card ? "Your number" : "Your reading";
  if (card){ box.classList.add("mid"); box.innerHTML = `<img class="card" src="${cardUrl}" alt="Your number, as a card to share">`; document.getElementById("save-card").href = cardUrl; return; }
  if (sheetView === "scan"){
    box.innerHTML = `<div class="scan"><div class="scan-qr">${qrSvg(qrMatrix(linkFor(state.answers, state.quick)), "QR code that opens this reading")}</div><div class="take-txt"><p class="take-k">Take it with you</p><p class="take-t">Scan to keep your reading on your phone.</p></div></div>`;
  } else box.innerHTML = `<img src="${slipUrl}" alt="Your reading, as it prints">`;
  box.classList.toggle("mid", sheetView === "scan");
  document.getElementById("scan").textContent = sheetView === "scan" ? "Slip" : "Scan";
}
async function openSheet(btn, mode){
  sheetOpener = btn || null; sheetMode = mode || "slip";
  if (sheetMode === "card") await drawCard(replay(state.answers, state.quick)); else await whenSlipReady();
  if (state.screen !== "result") return;
  const sheet = document.getElementById("sheet");
  sheetView = "slip"; renderSheet();
  let canShare = false;
  try { canShare = !!(navigator.share && navigator.canShare && navigator.canShare({files: [new File([""], "x.png", {type: "image/png"})]})); } catch (err) {}
  document.getElementById("share").hidden = !canShare;
  sheet.hidden = false; document.body.style.overflow = "hidden";
  document.getElementById("sheet-close").focus({preventScroll: true});
}
function closeSheet(){
  const sheet = document.getElementById("sheet");
  if (sheet.hidden) return;
  sheet.hidden = true; document.body.style.overflow = "";
  if (sheetOpener && sheetOpener.isConnected) sheetOpener.focus({preventScroll: true});
  sheetOpener = null;
}
async function shareSlip(){
  await whenSlipReady();
  try {
    const blob = await (await fetch(slipUrl)).blob();
    const file = new File([blob], "green-flag-forecast.png", {type: "image/png"});
    if (navigator.canShare && navigator.canShare({files: [file]})) await navigator.share({files: [file], title: "Green Flag Forecast"});
  } catch (err) {} /* cancelling the share sheet is fine; the button only shows where sharing a file works */
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function render(move){
  const c = replay(state.answers, state.quick);
  if (state.screen === "quiz" && c.done) state.screen = "result";
  if ((state.screen === "result" || state.screen === "divine") && !c.done) state.screen = state.answers.length ? "quiz" : "intro";
  const app = document.getElementById("app");
  app.innerHTML = state.screen === "quiz" ? quiz(c) : state.screen === "divine" ? divine() : state.screen === "result" ? result(c) : intro();
  document.getElementById("bar-top").hidden = state.screen === "intro";
  document.getElementById("wordmark").hidden = state.screen === "intro";
  document.getElementById("restart-top").hidden = state.screen === "intro";
  const tg = document.getElementById("quick");
  tg.hidden = state.screen !== "intro";
  tg.setAttribute("aria-checked", String(state.quick));
  document.getElementById("quick-state").textContent = state.quick ? "On" : "Off";
  if (state.screen === "result") drawSlip(c); else { slipJob++; slipUrl = ""; cardUrl = ""; document.getElementById("slip").innerHTML = ""; }
  if (state.screen !== "result") closeSheet();
  try { history.replaceState(null, "", state.screen === "result" ? `?r=${TREE_V}${c.quick ? "q" : "f"}${state.answers.join("")}` : location.pathname); } catch (err) {}
  if (move && booted){
    const f = app.querySelector("[data-focus]");
    if (f) f.focus({preventScroll: true});
    if (state.screen !== lastScreen) window.scrollTo(0, 0);
  }
  lastScreen = state.screen;
  booted = true;
}

function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

function reset(){
  clearTimers(); lock = false;
  state.screen = "intro"; state.answers = [];
  render(true);
}

function answer(i, btn){
  if (lock) return;
  const before = replay(state.answers, state.quick), node = NODES[before.id];
  if (!node || !node.opts[i]) return;
  state.answers.push(i);
  const c = replay(state.answers, state.quick);
  lock = true;
  document.querySelectorAll(".ans").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
  const says = document.getElementById("says"), ball = document.querySelector(".quiz .orb");
  if (c.last && says){
    says.textContent = c.last; says.classList.remove("swap"); void says.offsetWidth; says.classList.add("swap");
    if (ball) ball.classList.add("speak");
    const b = says.getBoundingClientRect();
    burst(b.left + b.width / 2, b.top - 20, 7);
  }
  timers.push(setTimeout(() => {
    lock = false;
    if (c.done) goDivine();
    else render(true);
  }, reduceMotion ? 0 : 750));
}

function goDivine(){
  if (reduceMotion){ state.screen = "result"; render(true); return; }
  state.screen = "divine"; render(true);
  DLINES.forEach((t, k) => {
    if (!k) return;
    timers.push(setTimeout(() => {
      const el = document.getElementById("d-line");
      if (!el) return;
      el.textContent = t; el.classList.remove("swap"); void el.offsetWidth; el.classList.add("swap");
    }, k * 900));
  });
  timers.push(setTimeout(() => { state.screen = "result"; render(true); arrive(); }, DLINES.length * 900 + 150));
}

/* The number in the ball counts up to the real total, then throws a few sparks. */
function arrive(){
  const el = document.getElementById("count");
  if (!el || reduceMotion) return;
  const n = parseFloat(el.textContent), t0 = performance.now(), dur = 900;
  el.textContent = "0";
  const tick = now => {
    if (!el.isConnected) return;
    const k = Math.min(1, (now - t0) / dur);
    el.textContent = k < 1 ? String(Math.round(n * (1 - Math.pow(1 - k, 3)))) : fmt(n);
    if (k < 1) requestAnimationFrame(tick);
    else { const b = el.getBoundingClientRect(); burst(b.left + b.width / 2, b.top + b.height / 2, 30); }
  };
  requestAnimationFrame(tick);
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "begin"){
    clearTimers(); lock = false; state.answers = []; state.screen = "quiz"; render(true);
  } else if (act === "answer"){
    answer(+b.dataset.i, b);
  } else if (act === "back"){
    if (lock) return;
    if (!state.answers.length) reset(); else { state.answers.pop(); render(true); }
  } else if (act === "restart"){
    reset();
  } else if (act === "print"){
    openSheet(b);
  } else if (act === "print-now"){
    whenSlipReady().then(() => { try { window.print(); } catch (err) {} });
  } else if (act === "share"){
    if (sheetMode === "card") shareCard(b); else shareSlip();
  } else if (act === "share-card"){
    shareCard(b);
  } else if (act === "scan"){
    sheetView = sheetView === "scan" ? "slip" : "scan"; renderSheet();
    document.getElementById("sheet-scroll").scrollTop = 0;
  } else if (act === "close-sheet"){
    closeSheet();
  } else if (act === "sheet-bg"){
    if (e.target === b) closeSheet();
  } else if (act === "quick"){
    state.quick = !state.quick;
    b.setAttribute("aria-checked", String(state.quick));
    document.getElementById("quick-state").textContent = state.quick ? "On" : "Off";
  }
});

/* Night sky behind the booth, and sparks in front of it. */
const sky = document.getElementById("sky"), fx = document.getElementById("fx");
const sctx = sky.getContext("2d"), fctx = fx.getContext("2d");
const css = getComputedStyle(document.documentElement);
const tone = n => css.getPropertyValue(n).trim() || "#FFF3DC";
const SPARK = [tone("--gold"), tone("--cream"), tone("--mist"), tone("--orchid")];
let W = 0, H = 0, stars = [], parts = [], raf = 0, fxDirty = false;

function sizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  sctx.setTransform(dpr, 0, 0, dpr, 0, 0); fctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawSky(0);
}
function drawSky(t){
  sctx.clearRect(0, 0, W, H);
  sctx.fillStyle = SPARK[1];
  for (const st of stars){
    sctx.globalAlpha = .3 + .4 * (.5 + .5 * Math.sin(t * st.s + st.p));
    sctx.beginPath(); sctx.arc(st.x, st.y, st.r, 0, 6.2832); sctx.fill();
  }
  sctx.globalAlpha = 1;
}
function burst(x, y, n){
  if (reduceMotion) return;
  for (let k = 0; k < n; k++){
    const a = Math.random() * 6.2832, sp = Math.random() * 4.2 + 1.2;
    parts.push({x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.4, life: 1, d: Math.random() * .012 + .012, r: Math.random() * 5 + 3, c: SPARK[k % SPARK.length]});
  }
}
function drawFx(){
  if (!parts.length){ if (fxDirty){ fctx.clearRect(0, 0, W, H); fxDirty = false; } return; }
  fctx.clearRect(0, 0, W, H); fxDirty = true;
  parts = parts.filter(p => p.life > 0);
  for (const p of parts){
    p.x += p.vx; p.y += p.vy; p.vy += .07; p.vx *= .99; p.life -= p.d;
    const r = p.r * Math.max(p.life, 0);
    fctx.globalAlpha = Math.max(p.life, 0); fctx.fillStyle = p.c;
    fctx.beginPath();
    fctx.moveTo(p.x, p.y - r);
    fctx.quadraticCurveTo(p.x, p.y, p.x + r, p.y);
    fctx.quadraticCurveTo(p.x, p.y, p.x, p.y + r);
    fctx.quadraticCurveTo(p.x, p.y, p.x - r, p.y);
    fctx.quadraticCurveTo(p.x, p.y, p.x, p.y - r);
    fctx.fill();
  }
  fctx.globalAlpha = 1;
}
function frame(ts){ drawSky(ts / 1000); drawFx(); raf = requestAnimationFrame(frame); }
function play(){ if (!reduceMotion && !raf && !document.hidden) raf = requestAnimationFrame(frame); }
function pause(){ cancelAnimationFrame(raf); raf = 0; }
window.addEventListener("resize", sizeCanvas);
document.addEventListener("visibilitychange", () => document.hidden ? pause() : play());
sizeCanvas(); play();

/* Keep a reading in progress if the page is updated while someone is mid-way, but only when the
   questions haven't changed: old answers replayed on a new tree would land on the wrong screen.
   Otherwise a reading link (?r=) opens straight onto its reading. */
function start(d){
  if (d && d.s && typeof d.s === "object" && d.s.v === TREE_V){
    state.answers = Array.isArray(d.s.answers) ? d.s.answers.filter(Number.isInteger) : [];
    state.screen = d.s.screen === "divine" ? "result" : (d.s.screen || "intro");
    state.quick = !!d.s.quick;
  } else if (SHARED && +SHARED[1] === TREE_V){
    const answers = [...SHARED[3]].map(Number), quick = SHARED[2] === "q";
    if (replay(answers, quick).done){ state.answers = answers; state.quick = quick; state.screen = "result"; }
  }
  render(false);
}
try {
  window.claude?.hot?.snapshot?.(() => ({s: {v: TREE_V, screen: state.screen, quick: state.quick, answers: state.answers.slice()}}));
} catch (err) {}
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
